<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethermoor — Park Simulation</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="app">

        <div id="control-panel">
            <h1>Aethermoor</h1>
            <div id="controls">
            <div class="btn-row">
                <button id="btn-play" aria-label="Play">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="btn-pause" aria-label="Pause">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
                </button>
                <button id="btn-reset" aria-label="Reset">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 5v5h5"/></svg>
                </button>
            </div>
            </div>
            <div id="speed-control">
                <label>Speed</label>
                <div class="slider-row">
                    <input type="range" id="slider-speed" min="1" max="4" value="1" step="1">
                    <span id="speed-display">1x</span>
                </div>
            </div>
            <div id="agent-control">
                <label>Agents</label>
                <div class="slider-row">
                    <input type="range" id="slider-agents" min="10" max="200" value="100" step="10">
                    <span id="agent-display">100</span>
                </div>
            </div>
            <div id="sim-clock">
                <span id="clock-display">9:00 AM</span>
            </div>
        </div>

        <div id="viz-container">

            <!-- Three.js renders the full 3D park environment here -->
            <canvas id="threejs-canvas"></canvas>

            <!-- D3 overlay panels - toggled on/off by cursor position -->
            <div id="d3-overlay">
                <div id="network-panel" class="overlay-panel">
                    <!-- D3 network graph renders here -->
                </div>
                <div id="queue-panel" class="overlay-panel">
                    <!-- D3 queue depth chart renders here -->
                </div>
                <div id="satisfaction-panel" class="overlay-panel">
                    <!-- D3 satisfaction heatmap renders here -->
                </div>
            </div>

        </div>

    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="js/main.js"></script>

</body>
</html>
